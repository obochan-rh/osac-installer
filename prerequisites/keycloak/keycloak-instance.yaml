apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak-tls
  namespace: keycloak
spec:
  issuerRef:
    kind: ClusterIssuer
    name: default-ca
  dnsNames:
  - keycloak
  - keycloak.keycloak.svc.cluster.local
  - osac-keycloak-service
  - osac-keycloak-service.keycloak.svc.cluster.local
  secretName: keycloak-tls-cert
  privateKey:
    rotationPolicy: Always
---
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: osac-keycloak
  namespace: keycloak
spec:
  instances: 1
  db:
    vendor: postgres
    host: keycloak-database
    port: 5432
    database: keycloak
    usernameSecret:
      name: keycloak-db-credentials
      key: username
    passwordSecret:
      name: keycloak-db-credentials
      key: password
  http:
    tlsSecret: keycloak-tls-cert
  hostname:
    hostname: keycloak.keycloak.svc.cluster.local
  proxy:
    headers: xforwarded
---
# Proxy Service that maps the standard HTTPS port (443) to the operator's
# non-standard port (8443). This ensures the JWT issuer URL
# (https://keycloak.keycloak.svc.cluster.local/realms/osac) is reachable
# without specifying a port, matching the "iss" claim in issued tokens.
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app: keycloak
spec:
  selector:
    app: keycloak
    app.kubernetes.io/instance: osac-keycloak
    app.kubernetes.io/managed-by: keycloak-operator
  ports:
  - name: https
    port: 443
    targetPort: 8443
    protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: keycloak
  namespace: keycloak
spec:
  to:
    kind: Service
    name: osac-keycloak-service
  port:
    targetPort: https
  tls:
    termination: passthrough
