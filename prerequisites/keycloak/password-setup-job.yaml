apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-password-setup
data:
  set-passwords.sh: |
    #!/bin/bash
    set -e

    KEYCLOAK_URL="https://osac-keycloak-service:8443"

    echo "Waiting for Keycloak to be ready..."
    until curl -k -s "${KEYCLOAK_URL}/realms/osac" > /dev/null 2>&1; do
      sleep 5
    done
    echo "Keycloak is ready!"

    set_password() {
      local username=$1
      local password=$2

      TOKEN=$(curl -k -s -X POST "${KEYCLOAK_URL}/realms/master/protocol/openid-connect/token" \
        -H 'Content-Type: application/x-www-form-urlencoded' \
        -d 'grant_type=password' \
        -d 'client_id=admin-cli' \
        -d "username=${KEYCLOAK_ADMIN}" \
        -d "password=${KEYCLOAK_ADMIN_PASSWORD}" 2>/dev/null | grep -o '"access_token":"[^"]*"' | cut -d'"' -f4)

      if [ -z "$TOKEN" ]; then
        echo "Could not get admin token"
        return 1
      fi

      USER_ID=$(curl -k -s -X GET "${KEYCLOAK_URL}/admin/realms/osac/users?username=$username" \
        -H "Authorization: Bearer $TOKEN" 2>/dev/null | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)

      if [ -z "$USER_ID" ]; then
        echo "Could not find user: $username"
        return 1
      fi

      curl -k -s -X PUT "${KEYCLOAK_URL}/admin/realms/osac/users/$USER_ID/reset-password" \
        -H "Authorization: Bearer $TOKEN" \
        -H "Content-Type: application/json" \
        -d "{\"type\":\"password\",\"value\":\"$password\",\"temporary\":false}" 2>/dev/null

      echo "✓ Set password for $username"
    }

    echo "Setting passwords for all tenant users..."
    set_password "tenant1_admin" "foobar"
    set_password "tenant1_user" "foobar"
    set_password "tenant2_admin" "foobar"
    set_password "tenant2_user" "foobar"
    set_password "twotenant" "foobar"
    set_password "my_user" "foobar"
    set_password "your_user" "foobar"

    echo "✓ All passwords set to 'foobar'"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-set-passwords
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: set-passwords
        image: quay.io/openshift/origin-cli:latest
        env:
        - name: KEYCLOAK_ADMIN
          valueFrom:
            secretKeyRef:
              name: osac-keycloak-initial-admin
              key: username
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: osac-keycloak-initial-admin
              key: password
        command:
        - /bin/bash
        - /scripts/set-passwords.sh
        volumeMounts:
        - name: scripts
          mountPath: /scripts
      volumes:
      - name: scripts
        configMap:
          name: keycloak-password-setup
          defaultMode: 0755
